    effective_work_experience_summaries_review_datatable: 'Work Experience Summaries to Review'
    effective_work_experience_records_datatable: 'Work Experience Records'
    effective_work_experience_projects_datatable: 'Work Experience Projects'
    effective_work_experience_reports_review_datatable: 'Work Experience Reports'
